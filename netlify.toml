# ============================================
# Netlify Configuration — Finance Dashboard
# ============================================

[build]
  # Specify the directory to publish
  publish = "front-end"

  # Since this is a static project, no build command is needed
  command = "echo 'Front-end deployment preparation complete.'"

[dev]
  # Netlify Dev (local preview) settings
  framework = "#static"
  publish = "front-end"
  port = 8888

[[redirects]]
  # Basic SPA behavior
  from = "/*"
  to = "/index.html"
  status = 200

[template.environment]
  # Informational only — variables can be set in the Netlify UI
  API_BASE = "http://localhost:8080/api/v1"
